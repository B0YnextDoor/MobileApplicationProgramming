[versions]
agp = "8.8.0"
coilCompose = "2.7.0"
glide = "4.16.0"
kotlin = "2.0.0"
compose = "1.7.6"
compose-material3 = "1.3.1"
androidx-activityCompose = "1.10.0"
kotlinxCoroutinesAndroid = "1.10.1"
navigationRuntimeKtx = "2.8.5"
navigationCompose = "2.8.5"
roomKtx = "2.6.1"
runtimeLivedata = "1.7.6"
lifecycleService = "2.8.7"
appcompat = "1.7.0"
uiViewbinding = "1.7.6"
constraintlayout = "2.2.0"
preference = "1.2.1"
material = "1.4.0"

[libraries]
androidx-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "roomKtx" }
